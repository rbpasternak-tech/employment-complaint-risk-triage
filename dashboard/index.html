  ["Cost / 1,000 docs",money(c.decisions.per1k),money(c.jev.per1k)],["Median latency",c.decisions.median_ms?Math.round(c.decisions.median_ms)+" ms":"n/a",c.jev.median_ms?Math.round(c.jev.median_ms)+" ms":"n/a"],
  ...OUT.map((o,i)=>[LBL[o],dd[i],jd[i]])].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");

const cts=[...new Set(R.map(r=>r.claim||"other"))].sort((a,b)=>R.filter(r=>(r.claim||"other")==b).length-R.filter(r=>(r.claim||"other")==a).length);
document.getElementById("chart").innerHTML=cts.map(ct=>{const rs=R.filter(r=>(r.claim||"other")==ct);return `<div class="brow"><div>${CT[ct]||ct}</div><div class="bar">${OUT.map(o=>{const n=rs.filter(r=>r.d===o).length;return n?`<div title="${LBL[o]}: ${n}" style="width:${100*n/rs.length}%;background:${COL[o]}"></div>`:""}).join("")}</div><div style="text-align:right;color:var(--mute)">${rs.length}</div></div>`}).join("");
const dis=R.filter(r=>!r.agree||(r.dct&&r.dct!==r.jct));
document.getElementById("dn").textContent=`(${dis.length})`;
document.getElementById("dis").innerHTML=dis.length?`<table><tr><th>Case</th><th>What differs</th><th>Decisions</th><th>Jev</th><th></th></tr>${dis.map(r=>{const o=!r.agree;return `<tr><td>${e(r.case)}</td><td>${o?"Outcome":"Claim type"}</td><td>${o?tag(r.d):e(CT[r.dct]||r.dct)}</td><td>${o?tag(r.j):e(CT[r.jct]||r.jct)}</td><td>${r.url?`<a href="${e(r.url)}" target="_blank">Opinion ↗</a>`:""}</td></tr>`}).join("")}</table>`:"<p>None — the tools agree on every ruling.</p>";
const opt=(id,lab,vals,f)=>document.getElementById(id).innerHTML=`<option value="">${lab}: all</option>`+vals.map(v=>`<option value="${e(v)}">${e(f?f(v):v)}</option>`).join("");
opt("fc","Claim",cts,v=>CT[v]||v);opt("fo","Decisions call",OUT,v=>LBL[v]);opt("fb","Batch",[...new Set(R.map(r=>r.batch))]);
let sk="date",sd=-1;

 const rs=R.filter(r=>(!q||(r.case||"").toLowerCase().includes(q))&&(!fc||(r.claim||"other")==fc)&&(!fo||r.d==fo)&&(!fa||(fa=="y")==r.agree)&&(!fb||r.batch==fb))
  .sort((a,b)=>(String(a[sk]??"")>String(b[sk]??"")?1:-1)*sd);
 document.querySelector("#t tbody").innerHTML=rs.map(r=>`<tr><td>${e(r.case)}</td><td>${e((r.court||"").toUpperCase())}</td><td>${e(r.date||"")}</td><td>${e(CT[r.claim]||r.claim||"")}</td><td>${tag(r.d)}</td><td>${tag(r.j)}</td><td>${r.agree?'<span class="y">Yes</span>':'<span class="n">No</span>'}</td><td>${tag(r.final)}</td><td>${r.url?`<a href="${e(r.url)}" target="_blank">${(r.url||"").includes("govinfo")?"GovInfo":"CourtListener"} ↗</a>`:""}</td></tr>`).join("")||'<tr><td colspan="9">No matching cases.</td></tr>'}
const fc_=document.getElementById("fc"),fo_=document.getElementById("fo"),fa_=document.getElementById("fa"),fb_=document.getElementById("fb");
["q","fc","fo","fa","fb"].forEach(i=>document.getElementById(i).addEventListener("input",draw));

document.getElementById("foot").textContent=`Sources: ${S.sources.join(", ")}. "Final" = accepted ground truth (outcome_final); accuracy is scored only where it is set. Cost uses list input-token prices (Decisions $0.10/M, Jev $0.042/M). Opinions: CourtListener and GovInfo (USCOURTS), public domain.`;
if(DATA.risk){const K=DATA.risk,T=["decisions","jev","baseline"],TN={decisions:"Decisions",jev:"Jev",baseline:"GPT baseline"},M=K.summary;
 const tb=t=>t?`<span class="tag ${t=="high"?"denied":t=="medium"?"granted_in_part":"granted"}">${t}</span>`:"—";
 const row=(s,lab)=>`<tr><td>${lab}</td>${T.map(t=>{const x=s[t];return `<td>${Math.round(100*x.acc_high_vs_not)}% · Brier ${x.brier.toFixed(3)}<br><span style="color:var(--mute);font-size:12px">high ${x.tiers.high} / med ${x.tiers.medium} / low ${x.tiers.low}</span></td>`}).join("")}<td>${Math.round(100*s.base_rate_survived)}% · Brier ${s.always_survive_brier.toFixed(3)}</td></tr>`;
 document.getElementById("rk").innerHTML=`<p style="background:#fff6e0;padding:8px 10px;border-radius:6px">All three tools rated almost every complaint <b>high</b>. 12 of the 13 confirmed cases survived, so "always high" already scores 92%. The tools have not yet shown they can tell strong complaints from weak ones. Tiny, selected sample: directional only.</p>
 <table><tr><th>Accuracy (high vs not) · Brier</th>${T.map(t=>`<th>${TN[t]}<br><span style="font-weight:400;color:var(--mute)">${M.ops[t].model}</span></th>`).join("")}<th>Naive "always survives"</th></tr>
 ${row(M.confirmed_13,"13 confirmed outcomes")}${row(M.all_known_18,"All 18 known (incl. 5 unconfirmed)")}
 <tr><td>Cost / 1,000 complaints</td>${T.map(t=>`<td>${money(M.ops[t].usd_per_1k_complaints)}</td>`).join("")}<td></td></tr>
 <tr><td>Median latency</td>${T.map(t=>`<td>${M.ops[t].median_latency_ms_risk} ms</td>`).join("")}<td></td></tr></table>
 <h3 style="margin-top:14px">Per case</h3><table><tr><th>Case</th><th>Outcome</th><th>Confirmed?</th>${T.map(t=>`<th>${TN[t]}</th>`).join("")}<th>Baseline rationale</th></tr>
 ${K.cases.map(c=>`<tr><td>${e(c.case_name)}<br><span style="color:var(--mute);font-size:12px">${e((c.court||"").toUpperCase())} · ${e(c.features.decisions.class_vehicle)} · ${e(c.features.decisions.factual_specificity)}</span></td><td>${tag(c.outcome_final)}</td><td>${c.confirmed?'<span class="y">Yes</span>':(c.outcome_final?'<span class="n">No</span>':"—")}</td>${T.map(t=>`<td>${tb(c.risk[t].risk_tier)} ${c.risk[t].p_survive==null?"":c.risk[t].p_survive.toFixed(2)}</td>`).join("")}<td style="font-size:12px">${e(c.risk.baseline.rationale)}${c.input_note?`<br><b>Note:</b> ${e(c.input_note)}`:""}</td></tr>`).join("")}</table>`;}
